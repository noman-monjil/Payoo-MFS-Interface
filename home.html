<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- google fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">
<!-- font awesome icon -->
 <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />

<!-- tailwind and daysi -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Payoo | Home</title>
    <link rel="shortcut icon" href="assets/logo.png" type="image/x-icon">
    <style>
        *{
             font-family: "Outfit", sans-serif;
        }
    </style>
</head>
<body class="min-h-screen  max-w-md bg-base-200 mx-auto">
  
    <header class="border-b-2 border-gray-300">

        <section class="w-11/12 mx-auto py-3 flex justify-between items-center  sticky top-0 bg-base-200 z-10">
            <div class="left flex">
               <div class="logo w-[60px]">
                 <img src="/assets/logo.png" alt="" cla>
               </div>
               <div class="balance-info ml-[4px]">
                <h2 class="font-extrabold"> $ <span id="account-balance">40</span></h2>
                <p class="text-neutral/50">Available Balance</p>

               </div>
            </div>
            <div class="right">
              
                <a href="/index.html" class="btn btn-soft "><i class="fa-solid fa-right-from-bracket"></i>Log out</a>
            </div>

        </section>
    </header>

                  <!---------------- button section -------------->

   <section class="container w-11/12 mx-auto py-10 space-y-5">
    <h1 class="text-3xl ">Welcome to Pay<span class="text-blue-500">oo</span></h1>
     <p class="text-neutral/50">Enjoy easy and convenient financial services with us. Cashout charge is low and </p>
    <div class="buttons grid grid-cols-3 gap-3">
        <button onclick="showOnly('addMoney')" class="btn btn-soft flex flex-col h-full py-2">
            <img src="/assets/opt-1.png" alt="">Add Money
        </button>
        <button onclick="showOnly('cashout')" class="btn btn-soft flex flex-col h-full py-2">
            <img src="/assets/opt-2.png" alt="">Cashout
        </button>
        <button onclick="showOnly('transferMoney')" class="btn btn-soft flex flex-col h-full py-2">
            <img src="/assets/opt-3.png" alt="">Send Money
        </button>
        <button onclick="showOnly('getBonusInput')" class="btn btn-soft flex flex-col h-full py-2">
            <img src="/assets/opt-4.png" alt="">Get Bonus
        </button>
        <button onclick="showOnly('payment')" class="btn btn-soft flex flex-col h-full py-2">
            <img src="/assets/opt-5.png" alt="">Pay Bill
        </button>
        <button onclick="showOnly('history-container')" class="btn btn-soft flex flex-col h-full py-2">
            <img src="/assets/opt-6.png" alt="">Transactions
        </button>
    </div>
   </section>


         <!--------------form bank Add money section-------------->
 <section  id="addMoney" class="w-11/12 mx-auto ">
    <h2 class="font-bold text-2xl">Add Money</h2>
    <div class="form mx-auto mt-5">
         <div class="card  rounded-2xl bg-base-100 w-full   shadow">
      <div class="card-body ">
        <fieldset class="fieldset">
            <!-- select bank -->
              <label class="label font-bold text-neutral">Select Bank</label>
             <select id="select-one" title="Bank Account" class="select w-full rounded-full bg-base-200">
                <option disabled selected value="selected-a" >Select a Bank</option>
                 <option value="AB Bank">AB Bank</option>
                 <option value="AL Bank">AL Bank</option>
                 <option value="City Bank">City Bank</option>
              </select>
                 <br>
            <!-- Bank Account number -->
          <label class="label font-bold text-neutral">Bank Account number</label>
          <input id="add-money-bank-number" maxlength="11" minlength="11" type="text" class="input border-none rounded-full bg-base-200 w-full" placeholder="Enter 11 Digit Number"  />
          
          <!--Bank  Amount to Add -->
          <label class="label font-bold text-neutral">Amount to Add</label>
          <input id="Bank-Amount-to-Add"  type="number" class="input border-none rounded-full bg-base-200 w-full" placeholder="Enter Amount to Withdraw"  />

          <!-- Bank add money  pin -->
          
          <label  class="label font-medium text-neutral">Pin number</label>
          <input id="add-money-pin" maxlength="4" minlength="4" type="password" class="input border-none bg-base-200 rounded-full w-full" placeholder="Enter 4 digit"  />
         
         
          <!-- add money button -->
           <button id="add-money-btn" class="btn btn-primary rounded-full font-semibold  mt-4 w-full">Add Money</button>
        </fieldset>
      </div>
    </div>
    </div>
   </section>


           <!-- ------------Cash Out Section -------------->
   <section  id="cashout" class="w-11/12 mx-auto hidden ">
    <h2 class="font-bold text-2xl">Cashout</h2>
    <div class="form mx-auto mt-5">
         <div class="card  rounded-2xl bg-base-100 w-full   shadow">
      <div class="card-body ">
        <fieldset class="fieldset">
            <!-- Cashout number -->
          <label class="label font-bold text-neutral">Agent Number</label>
          <input id="cashout-number-input" maxlength="11" minlength="11" type="text" class="input border-none rounded-full bg-base-200 w-full" placeholder="Enter 11 Digit Number"  />
          <!-- cahsout amount -->

          <label class="label font-bold text-neutral">Amount</label>
          <input id="cashout-amount-input"  type="number" class="input border-none rounded-full bg-base-200 w-full" placeholder="Enter Amount to Withdraw"  />

          <!-- cahsout pin -->
          
          <label  class="label font-bold text-neutral">Pin number</label>
          <input id="cashout-pin" maxlength="4" minlength="4" type="password" class="input border-none bg-base-200 rounded-full w-full" placeholder="Enter 4 digit"  />
          <!-- Cashout button -->
           <button id="withdraw-btn" class="btn btn-primary rounded-full font-semibold  mt-4 w-full">Withdraw Money</button>
        </fieldset>
      </div>
    </div>
    </div>
   </section>



   <!-------------- Transfer money section------------ -->
     <section  id="transferMoney" class="w-11/12 mx-auto hidden">
    <h2 class="font-bold text-2xl">Transfer Money</h2>
    <div class="form mx-auto mt-5">
         <div class="card  rounded-2xl bg-base-100 w-full   shadow">
      <div class="card-body ">
        <fieldset class="fieldset">
            <!-- Transfer money number input -->
          <label class="label font-bold text-neutral">Agent Number</label>
          <input id="transfer-money-number-input" maxlength="11" minlength="11" type="text" class="input border-none rounded-full bg-base-200 w-full" placeholder="Enter 11 Digit Number"  />

          <!--transfer money amount -->

          <label class="label font-bold text-neutral">Amount</label>
          <input id="transfer-money-amount-input"  type="number" class="input border-none rounded-full bg-base-200 w-full" placeholder="Enter Amount to Withdraw"  />

          <!-- Transfer pin -->
          
          <label  class="label font-bold text-neutral">Pin number</label>
          <input id="transfer-pin" maxlength="4" minlength="4" type="password" class="input border-none bg-base-200 rounded-full w-full" placeholder="Enter 4 digit"  />
          <!-- Cashout button -->
           <button id="send-money-btn" class="btn btn-primary rounded-full font-semibold  mt-4 w-full">Send Money</button>
        </fieldset>
      </div>
    </div>
    </div>
   </section>

                    <!-------------get bonus section-------------->
       <section  id="getBonusInput" class="w-11/12 mx-auto hidden">
    <h2 class="font-bold text-2xl">Get Bonus</h2>
    <div class="form mx-auto mt-5">
         <div class="card  rounded-2xl bg-base-100 w-full   shadow">
      <div class="card-body ">
        <fieldset class="fieldset">
            <!-- Get bonus input -->
          <label class="label font-bold text-neutral">Enter Bonus Coupon </label>
          <input id="get-bonus-input" maxlength="11" minlength="11" type="text" class="input border-none rounded-full bg-base-200 w-full" placeholder="Enter  your coupon 'nom200'"  />

          
          <!-- Get bonus button -->
           <button id="bonus-btn" class="btn btn-primary rounded-full font-semibold  mt-4 w-full">Get Bonus</button>
        </fieldset>
      </div>
    </div>
    </div>
   </section>




                          <!----------------pay bill section--------- -->
    <section  id="payment" class="w-11/12 mx-auto hidden ">
    <h2 class="font-bold text-2xl">Pay Bill</h2>
    <div class="form mx-auto mt-5">
         <div class="card  rounded-2xl bg-base-100 w-full   shadow">
      <div class="card-body ">
        <fieldset class="fieldset">

            <!-- select payment method -->
              <label class="label font-bold text-neutral">Select To Pay</label>
             <select id="select-mthod" title="Bank Account" class="select w-full rounded-full bg-base-200">
                <option disabled selected value="selected-one" >Select Payment Method</option>
                 <option value="Bkash">Bkash</option>
                 <option value="Nagad">Nagad</option>
                 <option value="Nexus pay">Nexus pay</option>
              </select>
                 <br>
            <!--payment Account number -->
          <label class="label font-bold text-neutral">Biller Account Number</label>
          <input id="Biller-Account-Number" maxlength="11" minlength="11" type="text" class="input border-none rounded-full bg-base-200 w-full" placeholder="Enter account number"  />
          
          <!--Amount to Pay -->
          <label class="label font-bold text-neutral">Amount to Pay</label>
          <input id="Amount-to-Pay"  type="number" class="input border-none rounded-full bg-base-200 w-full" placeholder="Add Amount to pay"  />

          <!--   pin number -->
          
          <label  class="label font-bold text-neutral">Pin number</label>
          <input id="pin-number" maxlength="4" minlength="4" type="password" class="input border-none bg-base-200 rounded-full w-full" placeholder="Enter 4 digit pin number"  />
         
         
          <!-- add money button -->
           <button id="pay-btn" class="btn btn-primary rounded-full font-semibold  mt-4 w-full">Pay Now</button>
        </fieldset>
      </div>
    </div>
    </div>
   </section>


        <section id="history-container" class="w-11/12 mx-auto py-5 hidden">
           
            <h2 class="font-bold text-xl pb-3 pt-3">Transaction History</h2>
            <div class="space-y-5 " id="history">
               <div class="Transaction-card border-b-2 border-gray-300">
               
               </div>
               
            </div>
          

        </section>




   <script src="script/machine.js"></script>
   <script src="script/addMoney.js"></script>

        <script src="script/cashout.js"></script>
        <script src="script/transferMoney.js"></script>
        <script src="script/getBonus.js"></script>
        <script src="script/paybill.js"></script>
</body>
</html>
